{% extends "base.html" %}

{% block title %}
Upload PDF
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="upload-card mx-auto">

        <div class="text-center">

            <i class="bi bi-file-earmark-pdf upload-icon"></i>

            <h2 class="mt-3">

                Upload Your PDF

            </h2>

            <p class="text-muted">

                Select a PDF document and chat with it using AI.

            </p>

        </div>

        <form
            method="POST"
            enctype="multipart/form-data"
            class="mt-4"
        >

            <div class="mb-4">

                <input
                    type="file"
                    class="form-control"
                    name="pdf"
                    accept=".pdf"
                    required
                >

            </div>

            <button
                id="uploadButton"
                type="submit"
                class="btn btn-primary btn-lg w-100"
            >

                <i class="bi bi-cloud-upload"></i>

                Upload & Process

            </button>

        </form>

    </div>

</div>

{% endblock %}
